name: Deploy to Github Pages

on:
  push:
    # Only run the workflow when pushing to the master branch
    branches: [master]
  # Removed pull_request trigger as it's unreliable for commit message checks in deployment

jobs:
  deploy: # All steps are now contained within this single job
    # 🚨 CORRECT PLACEMENT of the conditional check 🚨
    # The 'if' conditional must be a direct child of the job definition.
    if: contains(github.event.head_commit.message, '[deploy]')
    
    runs-on: ubuntu-latest

    permissions:
      contents: write # Necessary for the deployment action

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Hugo Setup and Build ---
      
      - name: Cache Hugo resources
        uses: actions/cache@v4
        env:
          cache-name: cache-hugo-resources
        with:
          path: resources
          key: ${{ env.cache-name }}

      # Note: setup-go@v5 is generally not needed if Hugo is installed via peaceiris/actions-hugo, 
      # but leaving it if your theme requires Go modules.
      - uses: actions/setup-go@v5
        with:
          go-version: "^1.17.0"
      
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build Hugo Site
        run: hugo --minify --gc

      # --- Deployment ---
      
      - name: Deploy to gh-pages branch 🚀
        # Added if: success() ensures deployment only happens if the build step succeeds
        if: success()
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: public
          clean: true
          single-commit: true